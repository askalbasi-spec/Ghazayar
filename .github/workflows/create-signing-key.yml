name: Create Ghazayar Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-key:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          test -n "$STORE_PASSWORD" || { echo 'Missing RELEASE_STORE_PASSWORD'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing RELEASE_KEY_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing RELEASE_KEY_ALIAS'; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate and encrypt signing key
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          keytool -genkeypair -noprompt \
            -keystore ghazayar-release.jks \
            -storetype JKS \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass:env STORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -dname 'CN=Ghazayar, OU=App, O=Ghazayar, L=Unknown, ST=Unknown, C=IR'
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in ghazayar-release.jks \
            -out ghazayar-release.jks.enc \
            -pass env:STORE_PASSWORD
          rm -f ghazayar-release.jks
      - name: Upload encrypted key temporarily
        uses: actions/upload-artifact@v4
        with:
          name: Ghazayar-Encrypted-Signing-Key
          path: ghazayar-release.jks.enc
          retention-days: 1
          if-no-files-found: error
